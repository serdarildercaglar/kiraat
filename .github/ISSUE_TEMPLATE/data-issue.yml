name: Data issue
description: A clip with a wrong transcript, a bad cut, music, noise or another quality problem.
labels: ["data"]
body:
  - type: textarea
    id: clips
    attributes:
      label: Clip IDs
      description: One `id` per line. Add the split and dataset revision if you know them.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What you heard or read, and which metric columns look off.
    validations:
      required: true
