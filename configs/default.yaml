# kiraat — Türkçe okuma-konuşma korpusu hattı, v2
#
# İki ilke bu dosyanın biçimini belirliyor:
#   1. Hiçbir eşik koda gömülmez; hat tamamen buradan tanımlanır.
#   2. Hiçbir eşik klip elemez. Eşikler yalnızca `recommended_subset`
#      politikasını besler; klipler her hâlükârda ölçümleriyle yayımlanır.

paths:
  raw_root: /mnt/310C8DBF109E2BFC/projects/turkish-tts/data-preparing/audio-data
  work_root: /mnt/310C8DBF109E2BFC/projects/turkish-tts/kiraat/work
  db: /mnt/310C8DBF109E2BFC/projects/turkish-tts/kiraat/work/db/state.sqlite

runtime:
  device: cuda:0
  gpu_batch_size: 32
  source_workers: 6
  gpu_stage_concurrency: 1
  lease_sec: 900
  max_job_attempts: 3
  log_level: INFO
  # Örnek koşu sınırları. Tam korpus koşusu ancak hattın tamamı küçük
  # örnekte doğrulandıktan sonra ve açık onayla yapılır; varsayılan bu
  # yüzden sınırlıdır, 0 = sınırsız değil, bilinçli olarak küçük tutulur.
  max_sources: 5
  # Örnek koşuda kanal sayısı sınırı: 0 = sınırsız. Kanal başına birden çok
  # kayıt gerektiren aşamalar (boilerplate madenciliği ≥3 kayıt ister) için
  # max_sources ile birlikte kullanılır: max_channels 5, max_sources 15 →
  # beş kanaldan üçer kayıt.
  max_channels: 0
  # Tohum verilirse kanal sırası ve kanal içi kayıt sırası rastgele
  # karıştırılır (tam koşuyu taklit eden örneklem); null = sıralı, belirli.
  sample_seed: null
  max_clips: 0
  # Saat bütçesi: kaynak seçimi kapsayıcı sürelerinin toplamı bu değere
  # ulaşınca durur (0 = sınırsız). max_sources ile birlikte kullanılabilir;
  # hangisi önce dolarsa. Bütçeyi aşan ilk kayıt alınır (alt sınır).
  max_hours: 0
  # Kanal başına kayıt sayısı sınırı (0 = sınırsız). Tüm kanalları eşit
  # temsil eden örnek koşular için `prepare.max_minutes` ile birlikte:
  # 27 kanal × 3 kayıt × ≤20 dk ≈ 25 saat. Kayıtlar yine rastgele seçilir;
  # kısa kayıtlara doğru eğilim yoktur, uzunlar tavanda kesilir.
  max_sources_per_channel: 0

sources:
  extensions: [".m4a", ".mp3", ".wav", ".flac", ".opus", ".webm"]
  exclude_patterns: []

prepare:
  target_sr: 24000        # v1 16 kHz'di; modern TTS için 24 kHz taban alınıyor
  highpass_hz: 40.0
  peak_ceiling_db: -1.0
  target_lufs: null       # klip başına normalizasyon yok, doğal seviye korunur
  ffmpeg_threads: 2
  # Çözülen ses kapsayıcı süresinin bu oranından kısaysa kayıt
  # `truncated_source` işareti alır (kesik indirme); işlenmeye devam eder.
  truncated_ratio: 0.95
  # Kayıt başına dakika tavanı (0 = tam kayıt): yalnızca ilk bu kadar dakika
  # çözülür. Kanalların medyan kaydı 0,2–2 saat arasında değiştiği için kanal
  # başına eşit saatlik örneklem ancak böyle kurulur. Tam koşuda 0.
  max_minutes: 0

# VAD artık kesim aracı değil: yalnızca ASR'ye verilecek konuşma bölgelerini
# bulur. Kesim kararı transcript'te alınır.
vad:
  threshold: 0.50
  min_speech_duration_ms: 250
  min_silence_duration_ms: 300
  speech_pad_ms: 100

asr:
  model: openai/whisper-large-v3
  language: tr
  word_timestamps: true
  condition_on_previous_text: false   # halüsinasyon zincirini kırar
  temperature: 0.0
  # Toplu çıkarım (faster-whisper BatchedInferencePipeline): VAD bölgeleri
  # 30 s pencerelere toplanıp birlikte çözülür; pencereler bağımsız olduğu
  # için önceki metne koşullanma zaten yoktur. 0 = sıralı.
  batch_size: 16

# Kelime zaman damgalarının doğruluğu bölütlemenin tamamını taşıdığı için
# zorlamalı hizalama ayrı bir aşamadır ve kendi güven skorunu üretir.
align:
  enabled: true
  # torchaudio MMS_FA (Meta MMS zorlamalı hizalayıcı, uroman sözlüğü); HF'deki
  # MahmoudAshraf/mms-300m-1130-forced-aligner aynı modelin diğer paketi.
  model: torchaudio/MMS_FA
  language: tur
  chunk_sec: 30.0        # Whisper damgaları kılavuz, parça başına hizalama
  max_chunk_sec: 60.0
  chunk_gap_sec: 0.3
  pad_sec: 0.5
  # word_confidence sütununun kaynağı: 'asr' (Whisper kelime olasılığı) ya da
  # 'align' (hizalayıcı kare olasılığı). Hizalayıcı skoru kalibre edilene
  # kadar 'asr'; skor her hâlükârda align_score_min/mean olarak yayımlanır.
  confidence_source: asr

# Süreler eğitim bütçesiyle tutarlı: tek cümlelerin %97'si 15 s altında,
# dolayısıyla tavan neredeyse hiç iç noktalamada bölmeye zorlamaz; hedef,
# cümle birleştirmenin aşmayacağı üst sınırdır (grup min_sec üstündeyse).
segment:
  min_sec: 1.5
  target_sec: 7.0
  max_sec: 15.0
  max_join_gap_sec: 1.2
  lead_pad_sec: 0.15
  trail_pad_sec: 0.25

clip_qc:
  enabled: true

dnsmos:
  enabled: true

speaker:
  model: pyannote/wespeaker-voxceleb-resnet34-LM
  cluster_cosine: 0.75

events:
  model: MIT/ast-finetuned-audioset-10-10-0.4593
  # v1'de bu modelin "Speech synthesizer" başlığı kapı olarak kullanıldı ve
  # 981 saati sildi; kör denetimde 131 işaretli klipte sıfır doğru pozitif
  # verdi. v2'de skoru yayımlanır, politikada kural olarak kullanılmaz.
  gate_synthetic: false

# Arka plan müziği. Üç ölçüm de yayımlanır; hiçbiri kapı değildir.
# `background_music` işareti yalnızca yayımlanan music_to_speech_db
# sütunundan türetilir, dolayısıyla kullanıcı kendi eşiğini kesebilir.
music:
  # Ucuz, çok etiketli sinyal — konuşmayla birlikte var olabilir.
  audioset_labels:
    ["Music", "Background music", "Soundtrack music", "Theme music",
     "Musical instrument", "Singing", "Song", "Jingle (music)"]
  # Fiziksel ölçü: kaynak ayrıştırması (torchaudio HDEMUCS_HIGH_MUSDB_PLUS),
  # eşlik (davul+bas+diğer) enerjisinin konuşma (vokal) enerjisine oranı.
  separator: hdemucs_high_musdb_plus
  # Ayrıştırma pahalı; AudioSet skoru bu eşiğin altındaki kliplerde hiç
  # koşmaz ve sütuna taban değer (-80 dB) yazılır. Hangi kliplerde gerçekten
  # koştuğu `music_db_separated` sütununda yayımlanır.
  separator_screen: 0.05
  # `background_music` işareti iki koşul ister: dB > inaudible_db VE AudioSet
  # skoru ≥ audioset_min. 29 Ağu 2026 sample-15: dB tek başına bir kanalda
  # (MuratKaraOfficial2021) 41 müziksiz klibi işaretledi (kullanıcı dinledi);
  # o kliplerde AudioSet medyan 0,10 / p90 0,20, diğer kanallardaki gerçek
  # müzikte medyan 0,53. 0,3 eşiği yanlış pozitiflerin 38/41'ini düşürür,
  # gerçek müziğin 28/33'ünü tutar. null = yalnızca dB.
  audioset_min: 0.3
  # Bu dB'nin üstü "duyulur müzik" sayılır ve `background_music` işareti
  # verilir. İşaret yayımlanan sütundan türetildiği için yeniden kesilebilir.
  # Kör dinleme (28 Ağu 2026, 34 klip, 5 bant): −40 dB altında 10 klipte
  # 9 "yok" 1 "hafif"; −40…−33 bandında 6/6 "belirgin". İlk tahmin −30 idi;
  # ölçüm −40 dedi.
  inaudible_db: -40.0
  # Dış sınıflandırıcı, isteğe bağlı. İKİLİ konuşma/müzik modelidir; "altında
  # müzik var mı" sorusunu yanıtlamaz, bu yüzden yalnızca üçüncü bir skor
  # olarak yayımlanır ve kör dinleme denetimi yapılmadan politikaya girmez.
  # 70 kliplik ölçümde bu modelin fiziksel ölçüyle sıra korelasyonu +0,311
  # çıktı; AudioSet skorunun aynı ölçüyle korelasyonu +0,799. Bu yüzden
  # varsayılan olarak kapalı. Açılırsa yalnızca sütun olarak yayımlanır.
  # Dış konuşma/müzik sınıflandırıcıları (AIGenLab v3/AST) 29 Ağu 2026'da
  # sınandı ve kullanılmıyor: v3 müziksiz kliplerin üçte ikisine "müzik"
  # dedi; AST varyantı AudioSet skoruyla aynı bilgiyi verdi. Yuva boş kalır.
  external_model: null
  external_gate: false

# Künye/anons madenciliği: kanalın kayıtlarının baş ve son bölgelerinde en az
# `min_recordings` ayrı kayıtta kelimesi kelimesine tekrar eden ifadeler.
# Bulunanlar ayrı klip olur ve `boilerplate` işareti alır; silinmez.
boilerplate:
  # Eşik: kanal kayıt sayısının min_ratio'su, ama en az min_recordings.
  # 3 kayıtlı kanalda 2, 50 kayıtlı kanalda 20.
  min_recordings: 2
  min_ratio: 0.4
  min_words: 3
  max_words: 24
  head_words: 80
  tail_words: 80

text:
  emit_raw: true
  emit_spoken: true

dedupe:
  speaker_field: speaker_id
  # Aynı metin + aynı ses yinelemedir; aynı metin + farklı ses korunur.
  enabled: true

# Önerilen alt küme. Bu bloğu değiştirmek veriyi yeniden üretmez, yalnızca
# `recommended` bayrağını yeniden hesaplar.
recommended_subset:
  # v2 (28 Ağu 2026): müzik eşiği −30 → −40 dB, kör dinlemeyle.
  # v3 (29 Ağu 2026): müzik kuralı dB sütunundan `background_music` işaretine
  # taşındı (dB VE AudioSet ≥ 0,3); dB tek başına bir kanalda müziksiz
  # klipleri eliyordu. Eşikler dinleme denetimiyle kesinleşene kadar geçici.
  version: "3"
  rules:
    - metric: speech_ratio
      min: 0.60
    - metric: clip_ratio
      max: 0.002
    - metric: internal_silence_sec
      max: 1.0
    - metric: word_confidence
      min: 0.60
    - metric: dnsmos_ovrl
      min: 3.0
      allow_missing: true
    - flag_absent: [oversize, forced_split, gap_split, short, duplicate, boilerplate, background_music]

export:
  sample_rate: 24000
  shard_rows: 2000
  # Kanal başına saat tavanı: v1'de iki kanal temiz saatlerin %79'unu
  # tutuyordu. Tavan yalnızca önerilen alt kümeye uygulanır.
  max_hours_per_channel: 120
