# kiraat — Türkçe okuma-konuşma korpusu hattı, v2
#
# İki ilke bu dosyanın biçimini belirliyor:
#   1. Hiçbir eşik koda gömülmez; hat tamamen buradan tanımlanır.
#   2. Hiçbir eşik klip elemez. Eşikler yalnızca `recommended_subset`
#      politikasını besler; klipler her hâlükârda ölçümleriyle yayımlanır.

paths:
  raw_root: /mnt/310C8DBF109E2BFC/projects/turkish-tts/data-preparing/audio-data
  work_root: /mnt/310C8DBF109E2BFC/projects/turkish-tts/kiraat/work
  db: /mnt/310C8DBF109E2BFC/projects/turkish-tts/kiraat/work/db/state.sqlite

runtime:
  device: cuda:0
  # Dağıtıcı (kiraat/scheduler.py): CPU işleri (prepare, segment, clip_qc)
  # ve GPU işleri (asr, align, music, dnsmos) ayrı havuzlarda üst üste biner. false:
  # tek süreçli sıralı yol; çıktı aynıdır, karşılaştırma ölçütü olarak durur.
  parallel: true
  source_workers: 6          # CPU havuzu işçi sayısı
  gpu_stage_concurrency: 1   # GPU havuzu işçi sayısı (her işçi bütün GPU modellerini yükler)
  gpu_batch_size: 32         # GPU klip aşamalarında iş başına klip (paketleme; ölçümü değiştirmez)
  cpu_batch_size: 64         # CPU klip aşamalarında iş başına klip
  clip_prefetch_threads: 4   # GPU klip aşamasında çözme/yeniden örnekleme ön-yükleme iş parçacığı
  log_level: INFO
  # Örnek koşu sınırları. Tam korpus koşusu ancak hattın tamamı küçük
  # örnekte doğrulandıktan sonra ve açık onayla yapılır; varsayılan bu
  # yüzden sınırlıdır, 0 = sınırsız değil, bilinçli olarak küçük tutulur.
  max_sources: 5
  # Örnek koşuda kanal sayısı sınırı: 0 = sınırsız. Kanal başına birden çok
  # kayıt gerektiren aşamalar (boilerplate madenciliği ≥3 kayıt ister) için
  # max_sources ile birlikte kullanılır: max_channels 5, max_sources 15 →
  # beş kanaldan üçer kayıt.
  max_channels: 0
  # Tohum verilirse kanal sırası ve kanal içi kayıt sırası rastgele
  # karıştırılır (tam koşuyu taklit eden örneklem); null = sıralı, belirli.
  sample_seed: null
  # Saat bütçesi: kaynak seçimi kapsayıcı sürelerinin toplamı bu değere
  # ulaşınca durur (0 = sınırsız). max_sources ile birlikte kullanılabilir;
  # hangisi önce dolarsa. Bütçeyi aşan ilk kayıt alınır (alt sınır).
  max_hours: 0
  # Kanal başına kayıt sayısı sınırı (0 = sınırsız). Tüm kanalları eşit
  # temsil eden örnek koşular için `prepare.max_minutes` ile birlikte:
  # 27 kanal × 3 kayıt × ≤20 dk ≈ 25 saat. Kayıtlar yine rastgele seçilir;
  # kısa kayıtlara doğru eğilim yoktur, uzunlar tavanda kesilir.
  max_sources_per_channel: 0

sources:
  # Ham veri azaltılmaz (kullanıcı kararı, 30 Ağu 2026): liste dar tutulduğu
  # için dört `.m4aa` dosyası (12,41 saat) sessizce atlanıyordu. Artık
  # ffmpeg'in ses akışı çıkarabildiği bütün kapsayıcılar alınır; video
  # kapsayıcıları da listededir, çünkü `prepare` yalnızca ses akışını çözer.
  # Ses akışı olmayan ya da bozuk dosya atlanmaz: kayıt `error` ile işaretlenir
  # ve koşu kaydında `sources_error` olarak görünür.
  # `scripts/inventory.py` bu listenin dışında kalan her ses dosyasını
  # raporlar — liste eksik kalırsa bir sonraki envanterde görünür.
  extensions: [".m4a", ".m4aa", ".m4b", ".mp3", ".mp2", ".wav", ".flac", ".opus",
               ".ogg", ".oga", ".webm", ".weba", ".aac", ".wma", ".aiff", ".aif",
               ".alac", ".ape", ".wv", ".caf", ".au", ".amr", ".mka", ".mp4",
               ".m4v", ".mkv", ".mov", ".avi", ".ts", ".3gp"]
  exclude_patterns: []

prepare:
  target_sr: 24000        # v1 16 kHz'di; modern TTS için 24 kHz taban alınıyor
  highpass_hz: 40.0
  # Tepe sınırlayıcı kapalı (null = uygulanmaz). Açıkken `peak_dbfs` ve
  # `clip_ratio` kaynağın değil hattın kendi tavanının ölçüsü oluyordu:
  # sınırlayıcı çıkışı 0,8913'te tuttuğu için `|x| ≥ 0,99` eşiği hiç
  # tetiklenmiyor, `clip_ratio` sıfıra çakılıyor ve aşağıdaki politika kuralı
  # hiçbir klibi elemiyordu (30 Ağu 2026, sentetik kırpık sinyalle ölçüldü).
  # Seviye klip başına sütun olarak yayımlanıyor; normalizasyon kullanıcının.
  peak_ceiling_db: null
  # Klip başına ses seviyesi normalizasyonu yoktur ve bir anahtarı da yoktur:
  # seviye `rms_dbfs`/`peak_dbfs` sütunlarıyla yayımlanır, normalizasyon
  # kullanıcının tercihidir. (Emilia yayımladığı sesi −20 dBFS'e çeker; biz
  # sese dokunmuyoruz.)
  ffmpeg_threads: 2
  # Çözülen ses kapsayıcı süresinin bu oranından kısaysa kayıt
  # `truncated_source` işareti alır (kesik indirme); işlenmeye devam eder.
  truncated_ratio: 0.95
  # Kayıt başına dakika tavanı (0 = tam kayıt): yalnızca ilk bu kadar dakika
  # çözülür. Kanalların medyan kaydı 0,2–2 saat arasında değiştiği için kanal
  # başına eşit saatlik örneklem ancak böyle kurulur. Tam koşuda 0.
  max_minutes: 0

# VAD artık kesim aracı değil: yalnızca ASR'ye verilecek konuşma bölgelerini
# bulur. Kesim kararı transcript'te alınır.
vad:
  threshold: 0.50
  min_speech_duration_ms: 250
  min_silence_duration_ms: 300
  speech_pad_ms: 100

asr:
  model: openai/whisper-large-v3
  # Ağırlık revizyonu (HF `Systran/faster-whisper-large-v3` commit'i). Sabit
  # olmazsa depo ağırlıkları yeniden yüklediğinde bütün transcript'ler sessizce
  # değişir ve hiçbir hata alınmaz; yayımlanan sayı yeniden üretilemez olur.
  revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
  language: tr
  word_timestamps: true
  condition_on_previous_text: false   # halüsinasyon zincirini kırar
  temperature: 0.0
  # Işın araması genişliği. Koda gömülüydü (31 Ağu 2026'da buraya taşındı);
  # değer değişmedi, faster-whisper'ın varsayılanı da 5.
  beam_size: 5
  # Toplu çıkarım (faster-whisper BatchedInferencePipeline): VAD bölgeleri
  # 30 s pencerelere toplanıp birlikte çözülür; pencereler bağımsız olduğu
  # için önceki metne koşullanma zaten yoktur. 0 = sıralı.
  batch_size: 16

# Kelime zaman damgalarının doğruluğu bölütlemenin tamamını taşıdığı için
# zorlamalı hizalama ayrı bir aşamadır ve kendi güven skorunu üretir.
align:
  enabled: true
  # torchaudio MMS_FA (Meta MMS zorlamalı hizalayıcı, uroman sözlüğü); HF'deki
  # MahmoudAshraf/mms-300m-1130-forced-aligner aynı modelin diğer paketi.
  model: torchaudio/MMS_FA
  language: tur
  chunk_sec: 30.0        # Whisper damgaları kılavuz, parça başına hizalama
  max_chunk_sec: 60.0
  chunk_gap_sec: 0.3
  pad_sec: 0.5
  # word_confidence sütununun kaynağı: 'asr' (Whisper kelime olasılığı) ya da
  # 'align' (hizalayıcı kare olasılığı). Hizalayıcı skoru kalibre edilene
  # kadar 'asr'; skor her hâlükârda align_score_min/mean olarak yayımlanır.
  confidence_source: asr

# Süreler eğitim bütçesiyle tutarlı: tek cümlelerin %97'si 15 s altında,
# dolayısıyla tavan neredeyse hiç iç noktalamada bölmeye zorlamaz; hedef,
# cümle birleştirmenin aşmayacağı üst sınırdır (grup min_sec üstündeyse).
segment:
  min_sec: 1.5
  target_sec: 7.0
  max_sec: 15.0
  max_join_gap_sec: 1.2
  lead_pad_sec: 0.15
  trail_pad_sec: 0.25

# Sınır iyileştirme (kiraat/boundaries.py): komşu klipler arasındaki damga
# çevresinde küçük bir pencerede ses enerjisine bakıp kesimi gerçek
# sessizliğe çeker; yalnızca damgalar arası boşluk iki payı barındıramayınca
# devreye girer. Bu eşikler kör dinleme turlarıyla oturdu (28–29 Ağu 2026)
# ama koda gömülü kalmıştı; "hiçbir eşik koda gömülmez" ilkesi gereği
# 31 Ağu 2026'da buraya taşındı, değerler değişmedi.
boundaries:
  # Damgadan ne kadar önce/sonra aranır (s). Öncesi kasıtlı kısa: Whisper
  # kelime bitişleri erken olduğu için sessizlik hep sonradadır.
  before_sec: 0.05
  after_sec: 0.60
  frame_ms: 20.0            # enerji zarfı kare genişliği
  hop_ms: 10.0              # zarf adımı
  silence_drop_db: 25.0     # yerel konuşma seviyesinin bu kadar altı sessizlik sayılır
  min_silence_sec: 0.06     # sessizlik sayılması için asgari süre
  # Bulunan sessizlik sonraki kelimenin damgasından bu kadar sonra
  # başlıyorsa kelime çoktan başlamıştır; sınır damgayı geçemez.
  silence_after_word_sec: 0.10

clip_qc:
  # Bu aşamanın kapatma anahtarı yok: ürettiği sütunlar (speech_ratio,
  # sessizlikler, seviye) politikanın ve şemanın çekirdeği. VAD ayarları
  # `vad` bölümünden gelir ve aşamanın sürümüne dâhildir.
  #
  # Uç sessizlikler (`leading_silence_sec`, `trailing_silence_sec`) ayrı bir
  # VAD geçişinden ölçülür. Politika geçişinin ayarları onları ölçemiyor:
  # `speech_pad_ms: 100` bölgeleri iki yandan uzatıyor ve
  # `min_silence_duration_ms: 300`, bölütlemenin kuyruk payından
  # (`segment.trail_pad_sec: 0,25`) uzun olduğu için silero son bölgeyi
  # kapatamayıp sesin sonuna kadar uzatıyordu; `trailing_silence_sec`
  # kliplerin %99,7'sinde 0,000 çıkıyordu (5 Eyl 2026). Paysız ve kısa
  # eşikli geçişte aynı 15 klipte 0,096–0,180 s ölçülüyor, çerçeve
  # enerjisiyle ölçülen 0,14–0,24 s ile uyumlu. Bu iki sütun politikada
  # kapı değildir; kapı olan `speech_ratio` ve `internal_silence_sec`
  # eski geçişten gelmeye devam eder, ölçüm tabanları değişmedi.
  edge_speech_pad_ms: 0
  edge_min_silence_duration_ms: 50

# DNSMOS P.835 (algısal kalite kestirimi): klip başına SIG (konuşma
# bozulması), BAK (arka plan gürültüsü), OVRL (genel) skorları. Aşama
# yalnızca ölçüm üretir; politika kuralı YOK — v4'te kaldırılan
# `dnsmos_ovrl ≥ 3,0` kuralı ancak skor kör dinlemeyle doğrulanırsa geri
# konur. Model microsoft/DNS-Challenge deposundaki sig_bak_ovr.onnx; küçük
# olduğu için depoya işlendi, içeriği aşağıdaki sha256 ile sabit ve aşama
# kuruluşta doğrular. Yol depo köküne göredir ve sürüme girmez; özet girer.
dnsmos:
  model_path: models/dnsmos/sig_bak_ovr.onnx
  model_sha256: 269fbebdb513aa23cddfbb593542ecc540284a91849ac50516870e1ac78f6edd

# Planlanan ama henüz yazılmamış aşamaların (konuşmacı kümeleme, olay
# etiketleri) konfig bölümleri BURADA DEĞİL, yazıldıklarında eklenecek.
# Önceden konmuş ayarlar 30 Ağu 2026'da çıkarıldı: `dnsmos.enabled: true`
# aşama olmadığı için "açık" görünüyordu ve politikada `dnsmos_ovrl ≥ 3,0`
# kuralının 12.958 klipte sessizce geçmesine zemin olmuştu (politika v4'te
# kaldırıldı). Konfig yalnızca uygulanan şeyi ilan eder; planlar
# `docs/NOTEBOOK.md` içindeki "Koşulacak deneyler" başlığında durur.
#
# (`dedupe` 6 Eyl 2026'da bu ilkeye getirildi: bekleyen `speaker_id` sütunu
# yerine ölçülen ses kimliğiyle karar veriyor, yani ilan ettiği şeyi
# uyguluyor ve konuşmacı aşamasını beklemiyor.)

# Arka plan müziği. Üç ölçüm de yayımlanır; hiçbiri kapı değildir.
# `background_music` işareti yalnızca yayımlanan music_to_speech_db
# sütunundan türetilir, dolayısıyla kullanıcı kendi eşiğini kesebilir.
music:
  # Ucuz, çok etiketli sinyal — konuşmayla birlikte var olabilir.
  audioset_model: MIT/ast-finetuned-audioset-10-10-0.4593
  audioset_revision: f826b80d28226b62986cc218e5cec390b1096902
  audioset_labels:
    ["Music", "Background music", "Soundtrack music", "Theme music",
     "Musical instrument", "Singing", "Song", "Jingle (music)"]
  # Fiziksel ölçü: kaynak ayrıştırması (torchaudio HDEMUCS_HIGH_MUSDB_PLUS),
  # eşlik (davul+bas+diğer) enerjisinin konuşma (vokal) enerjisine oranı.
  # Bu paketin ve hizalayıcının (MMS_FA) ağırlıkları torchaudio sürümüne
  # bağlıdır; ayrı revizyon alanı yok, requirements.txt sabitliyor.
  separator: hdemucs_high_musdb_plus
  # AST penceresi: klip bu uzunlukta pencerelere bölünür (10,24 s modelin
  # kendi girdi süresi), pencereler üzerinden azami skor alınır. Koda
  # gömülüydü, 31 Ağu 2026'da taşındı; değerler değişmedi.
  window_sec: 10.24
  hop_sec: 5.0
  # Ayrıştırma pahalı; AudioSet skoru bu eşiğin altındaki kliplerde hiç
  # koşmaz ve sütuna taban değer (-80 dB) yazılır. Hangi kliplerde gerçekten
  # koştuğu `music_db_separated` sütununda yayımlanır.
  separator_screen: 0.05
  # `background_music` işareti iki koşul ister: dB > inaudible_db VE AudioSet
  # skoru ≥ audioset_min. 29 Ağu 2026 sample-15: dB tek başına bir kanalda
  # (MuratKaraOfficial2021) 41 müziksiz klibi işaretledi (kullanıcı dinledi);
  # o kliplerde AudioSet medyan 0,10 / p90 0,20, diğer kanallardaki gerçek
  # müzikte medyan 0,53. 0,3 eşiği yanlış pozitiflerin 38/41'ini düşürür,
  # gerçek müziğin 28/33'ünü tutar. null = yalnızca dB.
  audioset_min: 0.3
  # Bu dB'nin üstü "duyulur müzik" sayılır ve `background_music` işareti
  # verilir. İşaret yayımlanan sütundan türetildiği için yeniden kesilebilir.
  # Kör dinleme (28 Ağu 2026, 34 klip, 5 bant): −40 dB altında 10 klipte
  # 9 "yok" 1 "hafif"; −40…−33 bandında 6/6 "belirgin". İlk tahmin −30 idi;
  # ölçüm −40 dedi.
  inaudible_db: -40.0
  # Dış sınıflandırıcı, isteğe bağlı. İKİLİ konuşma/müzik modelidir; "altında
  # müzik var mı" sorusunu yanıtlamaz, bu yüzden yalnızca üçüncü bir skor
  # olarak yayımlanır ve kör dinleme denetimi yapılmadan politikaya girmez.
  # 70 kliplik ölçümde bu modelin fiziksel ölçüyle sıra korelasyonu +0,311
  # çıktı; AudioSet skorunun aynı ölçüyle korelasyonu +0,799. Bu yüzden
  # varsayılan olarak kapalı. Açılırsa yalnızca sütun olarak yayımlanır.
  # Dış konuşma/müzik sınıflandırıcıları (AIGenLab v3/AST) 29 Ağu 2026'da
  # sınandı ve kullanılmıyor: v3 müziksiz kliplerin üçte ikisine "müzik"
  # dedi; AST varyantı AudioSet skoruyla aynı bilgiyi verdi. Yuva boş kalır.
  external_model: null

# Künye/anons madenciliği: kanalın kayıtlarının baş ve son bölgelerinde en az
# `min_recordings` ayrı kayıtta kelimesi kelimesine tekrar eden ifadeler.
# Bulunanlar ayrı klip olur ve `boilerplate` işareti alır; silinmez.
boilerplate:
  # Eşik: kanal kayıt sayısının min_ratio'su, ama en az min_recordings.
  # 3 kayıtlı kanalda 2, 50 kayıtlı kanalda 20.
  min_recordings: 2
  min_ratio: 0.4
  min_words: 3
  max_words: 24
  head_words: 80
  tail_words: 80

text:
  emit_raw: true
  emit_spoken: true

dedupe:
  # Aynı metin + aynı ses yinelemedir; aynı metnin ayrı bir okuması
  # korunur (prozodi çeşitliliği). "Aynı ses" bu alanların hepsinin birebir
  # tutmasıdır — sesin kendisini ölçenler. `word_confidence` ve sessizlik
  # payları kasten dışarıda: onlar klibin çevresini ölçer ve aynı jenerik
  # sesi bölümden bölüme farklı gösterir (6 Eyl 2026 ölçümü).
  # Kanal anahtara girmez: ölçümler tutuyorsa aynı kaydın kopyasıdır.
  identity_fields: [duration, loudness_lufs, rms_dbfs, peak_dbfs]
  enabled: true

# Önerilen alt küme. Bu bloğu değiştirmek veriyi yeniden üretmez, yalnızca
# `recommended` bayrağını yeniden hesaplar.
recommended_subset:
  # v2 (28 Ağu 2026): müzik eşiği −30 → −40 dB, kör dinlemeyle.
  # v3 (29 Ağu 2026): müzik kuralı dB sütunundan `background_music` işaretine
  # taşındı (dB VE AudioSet ≥ 0,3); dB tek başına bir kanalda müziksiz
  # klipleri eliyordu. Eşikler dinleme denetimiyle kesinleşene kadar geçici.
  # v6 (30 Ağu 2026): `word_confidence` kuralı kör dinlemeyle kaldırıldı.
  # v5 (30 Ağu 2026): `clip_ratio` kuralı kör dinlemeyle kaldırıldı (aşağıda).
  # v4 (29 Ağu 2026): `dnsmos_ovrl` kuralı kaldırıldı — DNSMOS aşaması
  # bağlanmadığı için sütun hiç üretilmiyordu ve kural `allow_missing: true`
  # ile 12.958 klibin hepsinde sessizce geçiyordu; politika "DNSMOS ≥ 3,0
  # uygulandı" gibi okunuyor ama hiçbir klibi etkilemiyordu. Hiçbir klibin
  # `recommended` değeri değişmez. Aşama bağlanınca ölçülüp geri konur.
  version: "6"
  rules:
    - metric: speech_ratio
      min: 0.60
    # v5 (30 Ağu 2026): `clip_ratio` kuralı kör dinlemeden geçemedi, kaldırıldı.
    # Sınırlayıcı kalkınca kural canlanmış ve 536 klip elemeye başlamıştı;
    # 532'si tek kanaldaydı (sess-Seslikitap, kliplerinin %93,2'si) — yani
    # sinyal klip değil kanal özelliğiydi, v1'i öldüren örüntünün aynısı.
    # 25 kliplik kör dinleme (altı bant, 0–0,0227, kanal ve skor gizli):
    # 24 "yok", 1 "hafif" ve o da en düşük bantta (0,00001); 25/25 "eğitime
    # girsin". Eşiğin üstündeki 7 klibin hiçbirinde bozulma duyulmadı.
    # Sütun yayımlanmaya devam ediyor, kullanıcı kendi eşiğini kesebilir.
    # - metric: clip_ratio
    #   max: 0.002
    - metric: internal_silence_sec
      max: 1.0
    # v6 (30 Ağu 2026): `word_confidence` kuralı kör dinlemeden geçemedi.
    # 30 klip, altı bant (0,18–0,99), kanal ve ölçüm gizli: 29 "metin doğru",
    # 1 "küçük hata" (o da en düşük klipte, 0,178); 30/30 "eğitime girsin".
    # 0,60 eşiği bu 30'un 15'ini eliyordu, 14'ü kusursuz bulundu.
    # Kulaktan bağımsız kontrol: hizalayıcı skoruyla sıra korelasyonu +0,262;
    # bantlar tek yönlü ama en kötü bantta bile align_score_mean medyanı
    # 0,938. Sinyal zayıf ama var — bu yüzden sütun yayımlanmaya devam ediyor
    # ve şemanın dediği gibi sıralama sinyali olarak kalıyor, kapı olmuyor.
    # - metric: word_confidence
    #   min: 0.60
    # DNSMOS aşaması 31 Ağu 2026'da bağlandı, `dnsmos_ovrl` artık üretiliyor;
    # kural yine de kör dinleme denetiminden geçmeden geri KONMAZ (v4'ün
    # gerekçesi yukarıda; kanıt yükü kapıdadır, veride değil):
    # - metric: dnsmos_ovrl
    #   min: 3.0
    - flag_absent: [oversize, forced_split, gap_split, short, duplicate, boilerplate, background_music]

